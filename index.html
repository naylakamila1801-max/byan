/* =========================================

const STORAGE_KEY = "berlyan_utbk_full_v1";

const defaultState = {
  progress: {},
  answers: {},
  answeredCount: 0,
  lastScore: null,
  examDate: "2027-05-01",
  schedules: {},
  tryoutAnswers: {},
  tryoutScore: null
};

let state;
try {
  state = {
    ...defaultState,
    ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")
  };
} catch (error) {
  state = { ...defaultState };
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    console.warn("Progress tidak dapat disimpan di browser ini.");
  }
  renderStats();
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function notify(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1800);
}

/* =========================================
   3. NAVIGASI
========================================= */

function showPage(name) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.toggle("active", page.id === "page-" + name);
  });

  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === name);
  });

  if (name === "materi") renderTopics();
  if (name === "jadwal") renderSchedule();
  if (name === "latihan") renderPractice();
  if (name === "tryout") renderTryout();
  if (name === "notebook") renderPrompt();

  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => showPage(button.dataset.page));
});

/* =========================================
   4. DASHBOARD DAN PROGRESS
========================================= */

function getProgress(code, topic) {
  return Number(state.progress[code + "|" + topic] || 0);
}

function allTopics() {
  return tests.flatMap(test => test.topics.map(topic => ({
    code: test.code,
    name: test.name,
    topic
  })));
}

function overallProgress() {
  const topics = allTopics();
  if (!topics.length) return 0;

  const sum = topics.reduce((total, item) => {
    return total + getProgress(item.code, item.topic);
  }, 0);

  return Math.round(sum / topics.length);
}

function renderStats() {
  const progress = overallProgress();

  document.getElementById("overall").textContent = progress + "%";
  document.getElementById("overallFill").style.width = progress + "%";
  document.getElementById("answered").textContent = state.answeredCount || 0;
  document.getElementById("score").textContent =
    state.lastScore === null ? "—" : state.lastScore + "%";

  document.getElementById("topicCount").textContent = allTopics().length;

  const percent = document.getElementById("materiPercent");
  const fill = document.getElementById("materiFill");

  if (percent) percent.textContent = progress + "%";
  if (fill) fill.style.width = progress + "%";
}

function renderTestCards() {
  document.getElementById("testCards").innerHTML = tests.map(test => {
    const average = Math.round(
      test.topics.reduce((sum, topic) =>
        sum + getProgress(test.code, topic), 0
      ) / test.topics.length
    );

    return `
      <div class="test-card" onclick="selectPractice('${test.code}')">
        <div class="test-code">${test.code}</div>
        <h3>${escapeHTML(test.name)}</h3>
        <p>${escapeHTML(test.desc)}</p>
        <div class="track"><div class="fill" style="width:${average}%"></div></div>
        <small>${average}% progress · ${test.topics.length} topik</small>
      </div>`;
  }).join("");
}

function renderTopics() {
  document.getElementById("topicGroups").innerHTML = tests.map(test => {
    const average = Math.round(
      test.topics.reduce((sum, topic) =>
        sum + getProgress(test.code, topic), 0
      ) / test.topics.length
    );

    return `
      <div class="card">
        <div class="eyebrow">${test.code}</div>
        <h3>${escapeHTML(test.name)}</h3>
        <div style="display:flex;justify-content:space-between;gap:8px">
          <small>Penguasaan materi</small><b>${average}%</b>
        </div>
        <div class="track"><div class="fill" style="width:${average}%"></div></div>
        ${test.topics.map(topic => {
          const value = getProgress(test.code, topic);
          return `
            <div class="topic-row">
              <div>
                <b>${escapeHTML(topic)}</b>
                <small>${value}% dikuasai</small>
              </div>
              <input type="range" min="0" max="100" step="25"
                value="${value}"
                aria-label="Progress ${escapeHTML(topic)}"
                onchange="setProgress('${test.code}',${JSON.stringify(topic)},this.value)">
            </div>`;
        }).join("")}
        <button class="btn secondary" style="margin-top:12px"
          onclick="selectPractice('${test.code}')">Latihan subtes →</button>
      </div>`;
  }).join("");

  renderStats();
}

window.setProgress = function(code, topic, value) {
  state.progress[code + "|" + topic] = Number(value);
  saveState();
  renderTopics();
  renderTestCards();
  notify("Progress materi disimpan");
};

/* =========================================
   5. HITUNG MUNDUR
========================================= */

function updateCountdown() {
  const date = state.examDate || "2027-05-01";
  document.getElementById("examDate").value = date;

  const target = new Date(date + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const days = Math.ceil((target - today) / 86400000);
  document.getElementById("days").textContent = Math.max(0, days);
}

document.getElementById("saveDate").addEventListener("click", () => {
  const date = document.getElementById("examDate").value;
  if (!date) return notify("Pilih tanggal terlebih dahulu.");

  state.examDate = date;
  saveState();
  updateCountdown();
  notify("Tanggal target diperbarui");
});

/* =========================================
   6. LATIHAN SOAL
========================================= */

let activeTest = "PU";
let questionIndex = 0;
let checkedQuestions = {};

function setupPracticeSelect() {
  document.getElementById("practiceSelect").innerHTML = tests.map(test =>
    `<option value="${test.code}">${test.code} — ${escapeHTML(test.name)}</option>`
  ).join("");

  document.getElementById("practiceSelect").value = activeTest;

  document.getElementById("practiceSelect").addEventListener("change", event => {
    activeTest = event.target.value;
    questionIndex = 0;
    renderPractice();
  });
}

window.selectPractice = function(code) {
  activeTest = code;
  questionIndex = 0;
  showPage("latihan");
  renderPractice();
};

function currentQuestion() {
  const test = tests.find(item => item.code === activeTest);
  return test.questions[questionIndex];
}

function renderPractice() {
  const test = tests.find(item => item.code === activeTest);
  if (!test) return;

  questionIndex = Math.min(questionIndex, test.questions.length - 1);
  document.getElementById("practiceSelect").value = activeTest;
  document.getElementById("questionCode").textContent = test.code;
  document.getElementById("questionTitle").textContent = test.name;
  document.getElementById("questionNumber").textContent =
    `Soal ${questionIndex + 1} dari ${test.questions.length}`;

  const question = currentQuestion();
  const key = activeTest + "|" + questionIndex;
  const alreadyChecked = Boolean(checkedQuestions[key]);
  const savedAnswer = state.answers[key];

  document.getElementById("questionArea").innerHTML = `
    <div class="question">
      <small>TOPIK: ${escapeHTML(question.topic)}</small>
      <h3>${escapeHTML(question.q)}</h3>
      <div class="options">
        ${question.options.map((option, index) => `
          <label class="option">
            <input type="radio" name="practiceAnswer" value="${index}"
              ${savedAnswer === index ? "checked" : ""}
              ${alreadyChecked ? "disabled" : ""}>
            <span><b>${"ABCDE"[index]}.</b> ${escapeHTML(option)}</span>
          </label>
        `).join("")}
      </div>
      <div class="explanation ${alreadyChecked ? "show" : ""}">
        ${alreadyChecked
          ? (savedAnswer === question.answer ? "Benar. " : "Belum tepat. ") +
            escapeHTML(question.explanation)
          : ""}
      </div>
    </div>`;

  document.getElementById("prevQ").disabled = questionIndex === 0;
  document.getElementById("nextQ").disabled =
    questionIndex >= test.questions.length - 1;

  document.getElementById("checkQ").textContent =
    alreadyChecked ? "Jawaban sudah diperiksa" : "Periksa jawaban";

  document.getElementById("practiceMessage").textContent = "";
}

document.getElementById("checkQ").addEventListener("click", () => {
  const key = activeTest + "|" + questionIndex;

  if (checkedQuestions[key]) {
    notify("Jawaban ini sudah diperiksa.");
    return;
  }

  const selected = document.querySelector(
    'input[name="practiceAnswer"]:checked'
  );

  if (!selected) return notify("Pilih salah satu jawaban.");

  const question = currentQuestion();
  const answer = Number(selected.value);

  state.answers[key] = answer;
  state.answeredCount = (state.answeredCount || 0) + 1;
  checkedQuestions[key] = true;

  saveState();
  renderPractice();
});

document.getElementById("prevQ").addEventListener("click", () => {
  questionIndex = Math.max(0, questionIndex - 1);
  renderPractice();
});

document.getElementById("nextQ").addEventListener("click", () => {
  const test = tests.find(item => item.code === activeTest);
  questionIndex = Math.min(test.questions.length - 1, questionIndex + 1);
  renderPractice();
});

  const questions = getTryoutQuestions();

  document.getElementById("tryoutArea").innerHTML =
    questions.map((question, index) => `
      <div class="question">
        <small>SOAL ${index + 1} · ${question.code}</small>
        <h3>${escapeHTML(question.q)}</h3>
        <div class="options">
          ${question.options.map((option, optionIndex) => `
            <label class="option">
              <input type="radio" name="to-${index}" value="${optionIndex}"
                ${state.tryoutAnswers[index] === optionIndex ? "checked" : ""}
                ${tryoutSubmitted ? "disabled" : ""}>
              <span><b>${"ABCDE"[optionIndex]}.</b> ${escapeHTML(option)}</span>
            </label>
          `).join("")}
        </div>
        <div class="explanation ${tryoutSubmitted ? "show" : ""}">
          ${tryoutSubmitted
            ? (state.tryoutAnswers[index] === question.answer
                ? "Benar. "
                : "Jawaban benar: " + "ABCDE"[question.answer] + ". ") +
              escapeHTML(question.explanation)
            : ""}
        </div>
      </div>`).join("");

  document.getElementById("toResult").textContent =
    tryoutSubmitted ? `Skor mini try out: ${state.tryoutScore}%` : "";
}

document.getElementById("submitTO").addEventListener("click", () => {
  if (tryoutSubmitted) {
    notify("Mulai ulang untuk mencoba lagi.");
    return;
  }

  const questions = getTryoutQuestions();
  const answers = {};

  for (let i = 0; i < questions.length; i++) {
    const selected = document.querySelector(`input[name="to-${i}"]:checked`);
    if (!selected) return notify("Jawab semua soal terlebih dahulu.");
    answers[i] = Number(selected.value);
  }

  const correct = questions.filter((question, index) =>
    answers[index] === question.answer
  ).length;

  state.tryoutAnswers = answers;
  state.tryoutScore = Math.round(correct / questions.length * 100);
  state.lastScore = state.tryoutScore;
  tryoutSubmitted = true;

  saveState();
  renderTryout();
  notify("Try out selesai. Pelajari pembahasannya.");
});

document.getElementById("restartTO").addEventListener("click", () => {
  state.tryoutAnswers = {};
  tryoutSubmitted = false;
  saveState();
  renderTryout();
  notify("Try out siap dikerjakan ulang.");
});

/* =========================================
   8. JADWAL HARIAN
========================================= */

function scheduleKey() {
  return document.getElementById("scheduleDate").value;
}

function renderSchedule() {
  const date = scheduleKey();
  const list = state.schedules[date] || [];

  document.getElementById("scheduleList").innerHTML = list.length
    ? list.slice().sort((a, b) => a.time.localeCompare(b.time)).map(task => `
      <div class="task ${task.done ? "done" : ""}">
        <input type="checkbox" ${task.done ? "checked" : ""}
          onchange="toggleTask('${date}','${task.id}')">
        <div style="flex:1">
          <span><b>${escapeHTML(task.time)}</b> · ${escapeHTML(task.title)}</span>
          <small style="display:block;margin-top:4px">${escapeHTML(task.duration)}</small>
        </div>
        <button class="btn ghost" onclick="deleteTask('${date}','${task.id}')">Hapus</button>
      </div>
    `).join("")
    : '<p class="muted">Belum ada sesi belajar untuk tanggal ini.</p>';

  document.getElementById("scheduleSummary").textContent =
    `${list.filter(task => task.done).length} dari ${list.length} sesi selesai`;
}

document.getElementById("scheduleDate").value =
  new Date().toLocaleDateString("en-CA");

document.getElementById("scheduleDate").addEventListener("change", renderSchedule);

document.getElementById("addTask").addEventListener("click", () => {
  const title = document.getElementById("taskTitle").value.trim();
  if (!title) return notify("Masukkan nama sesi belajar.");

  const date = scheduleKey();
  state.schedules[date] = state.schedules[date] || [];

  state.schedules[date].push({
    id: Date.now().toString(),
    time: document.getElementById("taskTime").value,
    title,
    duration: document.getElementById("taskDuration").value,
    done: false
  });

  document.getElementById("taskTitle").value = "";
  saveState();
  renderSchedule();
  notify("Sesi belajar ditambahkan.");
});

window.toggleTask = function(date, id) {
  state.schedules[date] = (state.schedules[date] || []).map(task =>
    task.id === id ? { ...task, done: !task.done } : task
  );
  saveState();
  renderSchedule();
};

window.deleteTask = function(date, id) {
  state.schedules[date] = (state.schedules[date] || []).filter(task =>
    task.id !== id
  );
  saveState();
  renderSchedule();
};

document.getElementById("clearSchedule").addEventListener("click", () => {
  if (!confirm("Hapus semua jadwal pada tanggal ini?")) return;
  delete state.schedules[scheduleKey()];
  saveState();
  renderSchedule();
});

/* =========================================
   9. PROMPT NOTEBOOKLM PER MATERI
========================================= */

function setupPromptSelectors() {
  document.getElementById("promptTest").innerHTML = tests.map(test =>
    `<option value="${test.code}">${test.code} — ${escapeHTML(test.name)}</option>`
  ).join("");

  document.getElementById("promptTest").addEventListener("change", renderPrompt);
  document.getElementById("promptTopic").addEventListener("change", renderPrompt);
}

function renderPrompt() {
  const test = tests.find(item =>
    item.code === document.getElementById("promptTest").value
  );

  const topicSelect = document.getElementById("promptTopic");
  const oldTopic = topicSelect.value;

  topicSelect.innerHTML = test.topics.map(topic =>
    `<option value="${escapeHTML(topic)}">${escapeHTML(topic)}</option>`
  ).join("");

  if (test.topics.includes(oldTopic)) topicSelect.value = oldTopic;

  const topic = topicSelect.value;

  document.getElementById("promptOutput").textContent = makePrompt(
    test.name, test.code, topic
  );
}

function makePrompt(testName, code, topic) {
  return `Bertindaklah sebagai tutor UTBK-SNBT yang mengajar Berlyan dengan target Fakultas Kedokteran.

SUBTES: ${testName} (${code})
MATERI KHUSUS: ${topic}

Gunakan sumber yang saya unggah di NotebookLM sebagai rujukan utama. Jika informasi tidak ditemukan dalam sumber, katakan dengan jujur dan jangan mengarang.

Tolong ajarkan materi "${topic}" secara lengkap dengan urutan berikut:

1. Tujuan pembelajaran dan konsep dasar dengan bahasa Indonesia yang mudah dipahami.
2. Penjelasan bertahap dari dasar ke tingkat menengah dan lanjut.
3. Istilah penting, aturan, rumus, atau pola berpikir yang relevan.
4. Contoh soal dan penyelesaian langkah demi langkah.
5. Strategi cepat yang tetap logis serta jebakan umum.
6. Ringkasan poin penting yang bisa dicatat.
7. Buat 10 soal pilihan ganda A-E yang bervariasi, dengan konteks dan angka yang tidak berulang.
8. Jangan tampilkan kunci jawaban sebelum saya mencoba menjawab.
9. Setelah saya menjawab, koreksi satu per satu dan jelaskan alasan jawaban benar serta kesalahan setiap opsi yang relevan.
10. Buat latihan ulang berdasarkan kesalahan saya.

Pastikan soal benar-benar berfokus pada materi "${topic}", bukan hanya soal umum dari subtes ${testName}. Jangan mengklaim bahwa soal adalah soal resmi UTBK jika bukan.`;
}

document.getElementById("copyPrompt").addEventListener("click", async () => {
  const text = document.getElementById("promptOutput").textContent;
  try {
    await navigator.clipboard.writeText(text);
    notify("Prompt berhasil disalin.");
  } catch (error) {
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("promptOutput"));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    notify("Teks dipilih. Salin secara manual.");
  }
});

document.getElementById("customPrompt").addEventListener("click", () => {
  const topic = document.getElementById("customTopic").value.trim();
  if (!topic) return notify("Tulis topik terlebih dahulu.");

  document.getElementById("promptOutput").textContent = makePrompt(
    "Topik khusus", "KUSTOM", topic
  );
});

/* =========================================
   10. RESET PROGRESS DAN MULAI WEBSITE
========================================= */

document.getElementById("resetProgress").addEventListener("click", () => {
  if (!confirm("Yakin ingin menghapus progress semua materi?")) return;

  state.progress = {};
  saveState();
  renderTopics();
  renderTestCards();
  notify("Progress materi direset.");
});

function init() {
  setupPracticeSelect();
  setupPromptSelectors();
  updateCountdown();
  renderStats();
  renderTestCards();
  renderTopics();
  renderPractice();
  renderTryout();
  renderSchedule();
  renderPrompt();
}

init();
</script>
